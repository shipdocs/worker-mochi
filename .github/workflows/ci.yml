name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

# The deployable image is built by Runpod's GitHub integration on each GitHub
# release (see README "Deployment"). It can't be pushed to GHCR: the Mochi DiT
# weights are a single 20 GB layer and GHCR limits layers to 10 GB.
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run unit tests
        run: |
          python -m pip install pytest==8.0.0
          python -m pytest tests -v

  # Builds the real Dockerfile without the model weights (they don't fit on a
  # hosted runner). The last build step runs src/selftest.py, so this catches
  # dependency, ComfyUI import and custom-node breakage before release.
  image-smoke:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - name: Build image without models (runs selftest)
        run: docker build --build-arg SKIP_MODELS=1 -t worker-mochi:ci .
